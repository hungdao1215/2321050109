<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4</title>
</head>
<body>
    <h1>Form tạo thông tin</h1>
    <form>
        <!-- Input nếu không truyền type thì type mặc định là text -->
         <div>
            <p><b>Họ và tên</b></p>
            <input type="text" name="hoVaTen">
         </div>
        <div>
            <p><b>Giới thiệu</b></p>
            <textarea name="gioiThieu"></textarea>
        </div>
        <div>
            <p><b>Email</b></p>
            <input type="email" name="email">
        </div>
        <!-- số đầu tiên: 0
        số tiếp theo: 9,3,6,8
        8 số cuối: 0-9 -->
        <div>
            <p><b>Số điện thoại</b></p>
            <input name="soDienThoai"
            type="tel"
            placeholder="Dạng số 123"
            required
            pattern="([0]{1}([3,6,8,9]{1})([0-9]{8}))">
        </div>
        <div>
            <p><b>Giới tính</b></p>
            <input type="radio" name="gioiTinh" value="male">Nam<br>
            <input type="radio" name="gioiTinh" value="female">Nữ
        </div>
        <div>
            <p><b>Sở thích</b></p>
            Game: <input type="checkbox" name="soThich" value="game"><br>
            Music: <input type="checkbox" name="soThich" value="music"><br>
            Sport: <input type="checkbox" name="soThich" value="sport"><br>
        </div>
        <div>
            <p><b>Trình duyệt web hay sử dụng</b></p>
            <input list="browsers">
            <datalist id="browsers"
               <option value="Internet Explorer">
               <option value="Firefox">
               <option value="Chrome">
               <option value="Opera">
            </datalist>
            <select name="browsers">
               <option value="Internet Explorer">Internet Explorer</option>
               <option value="Firefox">Firefox</option>
               <option value="Chrome">Chrome</option>
               <option value="Opera">Opera</option>
            </select>
        </div>
        <div>
            0 <input type="range" id="a" value="50"> 100
        </div>
        <div>
            <input type="submit">
            <button>Click</button>
            <input type="reset">
            <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/dvgZkm1xWPE?si=LcPy9NMgWnaJziKQ" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen></iframe>
        </div>
    </form>
    <MARQUEE>
        <img src="/anh/logo.jpg">
    </MARQUEE>
    <audio controls>
        <source src="/anh/logo.jpg" type="audio/mp3">
    </audio>
    <video controls>
        <source src="/anh/flashbang.mp4" type="video.mp4">
    </video>
</body>
</html>

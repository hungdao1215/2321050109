<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Internal JavaScript -->
    <script>
        //in ra màn hình
        document.writeln("Hello World! <br>");

        //khai báo biến
        var name = "chay go <br>";
        document.writeln(name);

        name = "Lo <br>";
        document.writeln(name)

        var year = 2026;
        document.writeln(year)

        //phép toán
        var soThuNhat = 10;
        var soThuHai = 5;
        var ketQua = 0;
        //cộng +
        document.write("<br> Ket qua soThu1 + soThu2 la: ")
        ketQua = soThuNhat+soThuHai;
        document.writeln(ketQua)
        //trừ -
        document.write("<br> Ket qua soThu1 - soThu2 la: ")
        ketQua = soThuNhat-soThuHai;
        document.writeln(ketQua)
        //nhân *
        document.write("<br> Ket qua soThu1 * soThu2 la: ")
        ketQua = soThuNhat*soThuHai;
        document.writeln(ketQua)
        //chia /
        document.write("<br> Ket qua soThu1 / soThu2 la: ")
        ketQua = soThuNhat/soThuHai;
        document.writeln(ketQua)
        //%
        document.write("<br> Ket qua soThu1 % soThu2 la: ")
        ketQua = soThuNhat%soThuHai;
        document.writeln(ketQua)

        //++
        document.writeln("<br>");
        document.writeln(++soThuNhat);

        //--
        document.writeln("<br>");
        document.writeln(--soThuNhat);

        //+=
        soThuNhat += soThuHai;
        document.writeln(soThuNhat);

        //-=
        soThuNhat -= soThuHai;
        document.writeln(soThuNhat);

        var ho = "Do";
        document.writeln("<br>" + ho + " " + name);
        document.writeln("<br>");
        document.writeln(ho.length);

        //kiểm tra kiểu dữ liệu của biến
        document.writeln(typeof(ho));
        document.writeln("<br>");
        //
        var hoVaTen = "Do Ri Con";
        document.writeln(hoVaTen.indexOf("R"));
        document.writeln("<br>");
        document.writeln(hoVaTen.includes("C"));
        document.writeln("<br>");
        document.writeln(hoVaTen.startsWith("Do"));
        //thay thế kí tự
        document.writeln(hoVaTen.replace("Do","Dang"));

        document.writeln("<br>");
        document.writeln(hoVaTen.toUpperCase());

        document.writeln("<br>");
        document.writeln(hoVaTen.toLowerCase());

        document.writeln("<br>");
        document.writeln(hoVaTen.toLocaleLowerCase());

        //Date
        var homNay = new Date;
        document.writeln("<br>");
        document.write(homNay);

        var ngay = new Date("9/30/2026");
        document.writeln("<br>");
        document.write(ngay);

        var namNay = homNay.getFullYear();
        document.writeln("<br>");
        document.write(namNay);

        var thangNay = homNay.getMonth() + 1;
        document.writeln("<br>");
        document.write(thangNay);

        var thu = homNay.getDay() + 1;
        document.writeln("<br>");
        document.write(thu);

        var soNgay = homNay.getDate();
        document.writeln("<br>");
        document.write(soNgay);
        
        document.writeln("<br>");
        document.writeln("hom nay la thu" + thu + "ngay" +soNgay+ "thang" +thangNay+ "nam" +namNay);

        //Mảng
        var mangSo = [1,2,3,4,5];
        document.writeln("<br>");
        document.writeln(mangSo[2]);
        document.writeln("<br>");
        document.writeln(mangSo.length);

        document.writeln("<br>");
        var mangTen = ["Quang Anh","Ly","Thang"];
        document.write(mangTen[2]);

        document.writeln("<br>");
        var mang = [1,2,3,4,5,"Quang Anh","Ly","Thang" ];
        document.write(mang[5]);

        var d = mang.concat(mangSo, mangTen);
        document.writeln("<br>");
        document.write(d.join("-"));

        var d = mang.concat(mangSo, mangTen);
        document.writeln("<br>");
        document.write(d.pop());

        var d = mang.concat(mangSo, mangTen);
        document.writeln("<br>");
        document.write(d.push("duy"));
        document.write(mangSo.reverse());//dao vi tri cuoi len dau

        //Object
        var thongTinSinhVien = {
            ten: "Tran Van Tuat",
            namSinh: 2005,
            queQuan: {
                thanhPho: "Thanh Hoa",
                phuong: "lon"
            }
        };
        document.write(thongTinSinhVien.queQuan.thanhPho);
        tuoi = namNay - thongTinSinhVien.namSinh;
        thongTinSinhVien.tuoi = tuoi;
        // console.log(thongTinSinhVien);
        //boolean: true nam/ false nu
        thongTinSinhVien.gioiTinh = true;
        var danhSach = [
            {
                ten: "Nguyen Van Tuat",
            namSinh: 2005,
            queQuan: {
                thanhPho: "Thanh Hoa",
                phuong: "lonto"
            }
            }
        ];
        console.log(danhSach);
        document.writeln("<br>");

        //== != > <
        //=== so sánh cả giá trị và kiểu dữ liệu
        var so1 = 10;
        var so2 = "10";
        document.writeln("<br>");
        document.writeln(so1 == so2);

        //&& ||
        document.writeln("<br>");
        if(thu>6){
            document.writeln("Cuối tuần");
        }
        else if(thu == 4){
            document.writeln("sắp đc ngủ");
        }
        else{
            document.writeln("Đi học");
        }
        document.writeln("<br>");

        //Kiểm tra số chẵn lẻ
        var so = "5687698172071327167212864123701";
        var doDai = so.length;
        var soCuoiCung = so[doDai-1];
        document.writeln("<br>");
        document.writeln(soCuoiCung);
        if(soCuoiCung % 2 == 0){
            document.writeln(so + "la so chan");
        }
        else{
            document.writeln(so + "la so le");
        }
        // if(so % 2 == 0){
        //     document.writeln("Số chẵn");
        // }
        // else{
        //     document.writeln("số lẻ");
        // }
        document.writeln("<br>");

        //switch case
        var d = new Date();
        var theDay = d.getDay();
        switch (theDay) {
            case 5:
                document.write("finally friday");
                break;
            case 6:
                document.write("Super Saturday");
                break;
            case 0:
                document.write("Sleepy Sunday");
                break;
            default:
                document.write("I'm looking forward to this weekend!");
        }

        document.writeln("<br>");
        for (var index = 1; index <= 10; index++) {
            document.writeln("<br>");
            document.write("Thích thú lần thứ" +" "+ index);
        }

        //var mang = [1,2,3,4,5,"Quang Anh","Ly","Thang" ];
        for (var i = 0; i <= mang.length; i++) {
            // document.writeln("<br>");
            // document.write(mang[1]);
            if(isNaN(mang[i]) == true){
                document.writeln("<br>");
                document.writeln("xin chao" + mang[i]);
            }
        }
        
        //while
        i = 0;
        while (i <= 10){
            document.write("The number is" + i);
            document.write("<br />");
            i = i + 1;
        }
        //do while
        var j = 0;
        do {
            document.write("the number is" + j);
            document.write("<br />");
            j = j + 1;
        }while (j <= 10)

        //popup
        alert("ditconmemay");

        // var r = confirm("Press a button");
        // if(r == true){
        //     document.write("You pressed OK!")
        // }
        // else{
        //     document.write("You pressed Cancel!")
        // }

        var r = prompt("Nhap vao ho va ten", "Nhap ten o day");
        document.write(r);
    </script>

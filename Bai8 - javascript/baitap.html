<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        Năm sinh: <input id="nam" type="number">
    </div>
    <div>
        <button onclick="tinh()">Tính tuổi</button>
    </div>
    <div>
        Tuổi: <input id="tuoi" type="number">
    </div>
    <script>
        function tinh(){
            var namSinh = parseInt(document.getElementById("nam").value);

            document.getElementById("tuoi").value = tinhTuoi(namSinh);
        }

        function tinhTuoi(namSinh){
            var namNay = new Date().getFullYear();
            var tuoi = namNay - namSinh;

            return tuoi;
        }
    </script>
</body>
</html>

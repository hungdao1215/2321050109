<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 6</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .khoi1{
            background-color: green;
        }
        .khoi2{
            background-color: yellow;
            /* 1 giá trị: cách đễu xung quanh = giá trị đó */
            /* 2 giá trị: giá trị đầu (trên dưới), giá trị 2(trái,phải) */
            /* 4 giá trị: theo thứ tự: trên, phải, dưới, trái */
            margin: auto;
            padding: 10px;
            /* margin là phần bên ngoài, padding là phần bên trong */
        }
        .khoi3{
            background-color: red;
        }
        .khoi4{
            background-color: grey;
            display: flex;
        }
        .khoi5{
            background-color: blue;
            width: 50%;
        }
        .khoi6{
            background-color: orange;
            width: 50%;
        }
    </style>
</head>
<body>
    <div class="khoi1">Khối 1</div>
    <div class="khoi2">Khối 2</div>
    <div class="khoi3">Khối 3</div>
    <div class="khoi4">
        <div class="khoi5">Khối 5</div>
        <div class="khoi6">Khối 6</div>
    </div>
</body>
</html>

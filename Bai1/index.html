<html>
    <head>
        <title>bai 1 html</title>
    </head>
    <body>
        Môn phát triển ứng dụng web + BTL
        <!-- Để chú thích dùng 2 cách
        cách 1: ctrl + k + c
        cách 2: ctrl + / -->
        <!--Đây là chú thích -->
        <p>Thẻ p là thẻ phân đoạn</p>
        <!-- Thẻ h là thẻ định dạng đề mục -->
        <h1>Thẻ H1</h1>
        <h2>Thẻ H2</h2>
        <h3>Thẻ H3</h3>
        <!-- Thẻ br để xuống dòng -->
        <p>Môn web <br> nhóm 03</p>

        <!-- Thẻ div và span đê phân chia đoạn -->
         <div>Đây là thẻ div</div>
         <span>Đây là thẻ span</span> <br>

         <b>chữ đậm</b> <br>
         <i>chữ nghiêng</i> <br>
         <u>chữ gạch chân</u> <br>

         <div>
            <font face="verdana">Môn phát triển ứng dụng web</font>
            <font color="blue">Nhóm 03</font>
            <font size="10">tiết 1 2</font> <br>
            <font face="arial" color="red" size="15">Hehe</font>
         </div>
    </body>
</html>
